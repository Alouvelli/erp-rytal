services:
  db:
    image: postgres:16-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-academic_db}
      POSTGRES_USER: ${POSTGRES_USER:-academic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-academic_pass}
    # Port exposé uniquement sur la boucle locale du serveur (accès via tunnel
    # SSH pour l'administration), jamais directement sur Internet.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-academic_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    # Accessible uniquement depuis le réseau Docker (et la boucle locale du
    # serveur pour le debug), jamais exposé publiquement.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: always
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --worker-class gthread --threads 2 --timeout 120 --access-logfile - --error-logfile -"
    volumes:
      # Le code est monté en direct : l'application lit ET écrit le fichier
      # .env à l'exécution (découverte et provisionnement des bases par
      # institut, voir academic_core/tenant_databases.py). Ne pas retirer ce
      # montage sous peine de casser le multi-tenant.
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/academic_core/media
    # nginx est le seul point d'entrée public ; gunicorn n'est exposé que sur
    # la boucle locale du serveur (debug via tunnel SSH).
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: always
    command: celery -A config.celery worker -l info --concurrency=4
    volumes:
      - .:/app
      - media_volume:/app/academic_core/media
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: always
    command: celery -A config.celery beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/academic_core/media:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # Webroot pour les challenges ACME Let's Encrypt (émission/renouvellement)
      - ./nginx/certbot:/var/www/certbot
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
