{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nouveau mot de passe — Plateforme de Gestion Académique</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root { --navy: #003d82; }
    body { background: linear-gradient(135deg, #003d82 0%, #0066cc 100%); min-height: 100vh; display: flex; align-items: center; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .login-card { border: none; border-radius: 14px; box-shadow: 0 16px 48px rgba(0,0,0,.3); overflow: hidden; }
    .login-header { background: linear-gradient(135deg, #003d82, #0066cc); padding: 1.75rem 1.5rem 1.5rem; text-align: center; }
    .login-body { padding: 1.75rem 1.75rem 1.5rem; }
    .form-label { font-size: .8rem; font-weight: 600; color: #475569; margin-bottom: 5px; }
    .form-control { font-size: .875rem; border: 1.5px solid #e2e8f0; border-radius: 8px; padding: 9px 12px; transition: border-color .15s; }
    .form-control:focus { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(0,61,130,.12); outline: none; }
    .input-group-text { border: 1.5px solid #e2e8f0; border-right: none; background: #f8fafc; color: #94a3b8; }
    .input-group .form-control { border-left: none; }
    .input-group:focus-within .input-group-text,
    .input-group:focus-within .form-control { border-color: var(--navy); }
    .toggle-pwd { border: 1.5px solid #e2e8f0; border-left: none; background: #f8fafc; cursor: pointer; padding: 0 12px; color: #94a3b8; transition: color .15s; }
    .toggle-pwd:hover { color: var(--navy); }
    .btn-login { background: linear-gradient(135deg, #003d82, #0055b3); color: #fff; border: none; border-radius: 8px; padding: 10px; font-size: .9rem; font-weight: 700; width: 100%; transition: all .18s; box-shadow: 0 4px 12px rgba(0,61,130,.35); }
    .btn-login:hover { background: linear-gradient(135deg, #002d62, #003d82); color: #fff; transform: translateY(-1px); }
    .alert-danger { background: #fff1f2; color: #9f1239; border: none; border-radius: 8px; font-size: .82rem; padding: 10px 14px; display: flex; align-items: center; gap: 8px; }
  </style>
</head>
<body>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-9 col-md-6 col-lg-4">
      <div class="card login-card my-4">

        <div class="login-header">
          <div style="width:72px;height:72px;border-radius:16px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;border:2px solid rgba(255,255,255,.25);">
            <i class="bi bi-shield-lock-fill" style="font-size:2rem;color:#fff;"></i>
          </div>
          <h5 style="color:#fff;font-weight:700;margin:0 0 4px;">Nouveau mot de passe</h5>
          <p style="color:rgba(255,255,255,.75);font-size:.8rem;margin:0;">{{ user.get_full_name }}</p>
        </div>

        <div class="login-body">
          {% if error %}
          <div class="alert-danger mb-3">
            <i class="bi bi-exclamation-circle-fill"></i> {{ error }}
          </div>
          {% endif %}
          <form method="post" novalidate>
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label">Nouveau mot de passe</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" name="password1" id="pwd1" class="form-control"
                       placeholder="Nouveau mot de passe" autofocus required minlength="6">
                <button type="button" class="toggle-pwd" onclick="togglePwd('pwd1',this)">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label">Confirmer le mot de passe</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                <input type="password" name="password2" id="pwd2" class="form-control"
                       placeholder="Confirmer le mot de passe" required>
                <button type="button" class="toggle-pwd" onclick="togglePwd('pwd2',this)">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>
            <button type="submit" class="btn-login">
              <i class="bi bi-check-lg me-1"></i> Enregistrer le mot de passe
            </button>
          </form>
        </div>

      </div>
      <div style="text-align:center;font-size:.72rem;color:rgba(255,255,255,.5);">
        <i class="bi bi-shield-check me-1"></i> Connexion sécurisée
      </div>
    </div>
  </div>
</div>
<script>
function togglePwd(id, btn) {
  var input = document.getElementById(id);
  var show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.querySelector('i').className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
}
</script>
</body>
</html>
