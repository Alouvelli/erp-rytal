{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lien invalide — Plateforme de Gestion Académique</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root { --navy: #003d82; }
    body { background: linear-gradient(135deg, #003d82 0%, #0066cc 100%); min-height: 100vh; display: flex; align-items: center; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .login-card { border: none; border-radius: 14px; box-shadow: 0 16px 48px rgba(0,0,0,.3); overflow: hidden; }
    .login-header { background: linear-gradient(135deg, #7f1d1d, #b91c1c); padding: 1.75rem 1.5rem 1.5rem; text-align: center; }
    .login-body { padding: 2rem 1.75rem; text-align: center; }
    .btn-login { background: linear-gradient(135deg, #003d82, #0055b3); color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: .9rem; font-weight: 700; transition: all .18s; text-decoration: none; display: inline-block; }
    .btn-login:hover { background: linear-gradient(135deg, #002d62, #003d82); color: #fff; transform: translateY(-1px); }
  </style>
</head>
<body>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-9 col-md-6 col-lg-4">
      <div class="card login-card my-4">

        <div class="login-header">
          <div style="width:72px;height:72px;border-radius:16px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;border:2px solid rgba(255,255,255,.25);">
            <i class="bi bi-x-circle-fill" style="font-size:2rem;color:#fff;"></i>
          </div>
          <h5 style="color:#fff;font-weight:700;margin:0 0 4px;">Lien invalide ou expiré</h5>
        </div>

        <div class="login-body">
          <p style="color:#64748b;font-size:.88rem;margin-bottom:1.5rem;">
            Ce lien de réinitialisation est invalide ou a expiré (validité : 2 heures).<br>
            Veuillez faire une nouvelle demande.
          </p>
          <a href="{% url 'accounts:password_reset_request' %}" class="btn-login me-2">
            <i class="bi bi-arrow-repeat me-1"></i> Nouvelle demande
          </a>
          <a href="{% url 'accounts:login' %}" style="font-size:.8rem;color:var(--navy);text-decoration:none;display:block;margin-top:1rem;">
            <i class="bi bi-arrow-left me-1"></i> Retour à la connexion
          </a>
        </div>

      </div>
    </div>
  </div>
</div>
</body>
</html>
